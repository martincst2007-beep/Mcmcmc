<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Video</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      text-align: center;
      color: #38bdf8;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      color: #94a3b8;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #0369a1;
    }

    .output-box {
      margin-top: 20px;
      display: none;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .click-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .play-btn {
      width: 70px;
      height: 70px;
      background: rgba(2, 132, 199, 0.8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 30px;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- MODO GENERADOR (Se muestra si no hay parámetros en la URL) -->
  <div class="card" id="generatorView">
    <h2>Generador de Link de Video</h2>
    
    <label for="adInput">Link del Anuncio:</label>
    <input type="url" id="adInput" placeholder="https://tu-anuncio.com">

    <label for="videoInput">Link del Video (Videy):</label>
    <input type="url" id="videoInput" placeholder="https://videy.co/v?id=xxx">

    <button onclick="generateLink()">Generar Link Final</button>

    <div class="output-box" id="outputBox">
      <label>Tu enlace listo para compartir:</label>
      <input type="text" id="resultUrl" readonly onclick="this.select()">
      <button onclick="copyLink()" style="background-color: #16a34a; margin-top: 8px;">Copiar Enlace</button>
    </div>
  </div>

  <!-- MODO REPRODUCTOR (Se muestra cuando el usuario entra desde un enlace generado) -->
  <div class="video-container" id="playerView" style="display: none;">
    <div class="click-overlay" id="overlay"></div>
    <div class="play-btn">▶</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const encodedAd = params.get('ad');
    const encodedVideo = params.get('vid');

    // Si la URL contiene parámetros 'ad' y 'vid', mostramos el reproductor
    if (encodedAd && encodedVideo) {
      document.getElementById('generatorView').style.display = 'none';
      document.getElementById('playerView').style.display = 'flex';

      const adUrl = window.atob(encodedAd);
      const videoUrl = window.atob(encodedVideo);

      let clicked = false;
      document.getElementById('overlay').addEventListener('click', function() {
        if (!clicked) {
          window.open(adUrl, '_blank');
          clicked = true;
        } else {
          window.location.href = videoUrl;
        }
      });
    }

    // Función para crear la URL compartible
    function generateLink() {
      const ad = document.getElementById('adInput').value.trim();
      const video = document.getElementById('videoInput').value.trim();

      if (!ad || !video) {
        alert("Por favor completa ambos campos.");
        return;
      }

      // Codifica en Base64 para ocultar las URLs a simple vista
      const b64Ad = window.btoa(ad);
      const b64Video = window.btoa(video);

      const baseUrl = window.location.origin + window.location.pathname;
      const finalUrl = `${baseUrl}?ad=${b64Ad}&vid=${b64Video}`;

      document.getElementById('resultUrl').value = finalUrl;
      document.getElementById('outputBox').style.display = 'block';
    }

    function copyLink() {
      const copyText = document.getElementById("resultUrl");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("¡Enlace copiado al portapapeles!");
    }
  </script>

</body>
</html>
